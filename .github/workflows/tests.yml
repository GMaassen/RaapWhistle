name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 5.1 is what the game runs; 5.4 is what a developer is most likely to
        # have installed locally. Both must stay green.
        lua: ["5.1", "5.4"]
    name: lua ${{ matrix.lua }}
    steps:
      - uses: actions/checkout@v7

      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: ${{ matrix.lua }}

      - name: Syntax-check addon sources
        run: |
          for f in RaapWhistle.lua tests/*.lua; do
            echo "  $f"
            lua -e "assert(loadfile('$f'))"
          done

      - name: Check the .toc manifests
        run: lua tests/check_toc.lua

      - name: Run the offline suite
        run: lua tests/run_tests.lua
