name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the packager reads history and tags to build a changelog

      # Builds the addon zip and attaches it to the GitHub release. Uploading to
      # CurseForge / WoWInterface / Wago only happens if those secrets are set;
      # without them this is just a zip, which is all a personal addon needs.
      - uses: BigWigsMods/packager@v2.5.1
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
